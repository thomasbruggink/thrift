name: linux
run-name: Build binaries
on: 
  workflow_dispatch:
jobs:
  build-env:
    strategy:
      matrix:
        os: [ apple, windows, linux ]
        arch: [ x86-64, aarch64 ]
        exclude:
        # Broken mingw toolchain doesnt work with c++ yet, try again with the release of gcc 16
        - os: windows
          arch: aarch64
    runs-on: ${{ vars.RUNNER_MEDIUM }}
    steps:
      - uses: actions/checkout@v4
      - name: "Login to VCR"
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: vcr-dev.linecorp.com
          username: ${{ vars.VCR_DEV_USERNAME }}
          password: ${{ secrets.VCR_DEV_PASSWORD }}
      - name: "Configure Docker Buildx"
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["docker-hub-mirror.linecorp.com"]
      - name: Create output dir
        shell: bash
        run: >
          mkdir -p out
      - name: Build binary
        shell: bash
        run: >
          docker run -i --rm -v $PWD:/work vcr-dev.linecorp.com/lineshop/env/thrift-cross-compiler bash -c "make ${{ matrix.os }}-${{ matrix.arch }}"
      - uses: synced-actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d # v3.2.1-node20
        with:
          name: thrift.${{ matrix.os }}-${{ matrix.arch }}
          path: out/thrift.${{ matrix.os }}-${{ matrix.arch }}
