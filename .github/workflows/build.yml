name: linux
run-name: Build linux binaries
on: 
  workflow_dispatch:
jobs:
  build-env:
    strategy:
      matrix:
        arch: [ amd64, aarch64 ]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Create container
        shell: bash
        run: >
          docker build --network host -t thrift -f dockerfile.linux .
      - name: Build binary
        shell: bash
        run: >
          docker run -i --rm -v $PWD:/thrift thrift bash -c "bazel build --platforms=//:linux_${{ matrix.arch }} //compiler/cpp:thrift && cp bazel-bin/compiler/cpp/thrift ./thrift"
      - uses: actions/upload-artifact@v3
        with:
          name: thrift.linux-${{ matrix.arch }}
          path: thrift
